<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Campus Mood Booth</title>
  <link rel="stylesheet" type="text/css" href="css/styles.css">
</head>
<body>

  <div id="booth">
    <h1 id="moodTitle">Campus Mood Booth</h1>
    <p id="statusMessage">How are you feeling on campus today?</p>

    <div id="buttons">
      <button id="focusedBtn">Focused</button>
      <button id="tiredBtn">Tired</button>
      <button id="energizedBtn">Energized</button>
    </div>

    <p id="hint">Press R to reset the message.</p>

    <button id="saveBtn">Save mood?</button>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
